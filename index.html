<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rainsek - Tecnología, Bases de Datos, Electrónica y Videojuegos</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #060b16;
      color: #e6e6e6;
    }

    /* Fondo animado */
    .bg-anim {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: radial-gradient(circle, #0b162b, #060b16 80%);
      overflow: hidden;
    }
    .bg-anim span {
      position: absolute;
      display: block;
      width: 20px;
      height: 20px;
      background: rgba(0,150,255,0.2);
      animation: move 10s linear infinite;
      border-radius: 50%;
    }
    @keyframes move {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-1200px) scale(0.2); }
    }

    header {
      background: linear-gradient(90deg, #0f1f3d, #08101f);
      padding: 20px;
      text-align: center;
      color: #4db8ff;
      font-size: 2.2rem;
      font-weight: bold;
      border-bottom: 2px solid #1a3a66;
    }

    /* Menú */
    nav {
      background: #0d1424;
      padding: 10px;
      display: flex;
      justify-content: center;
      gap: 20px;
      border-bottom: 1px solid #1d2f4d;
    }
    nav a {
      color: #83c8ff;
      font-weight: bold;
      text-decoration: none;
      transition: 0.3s;
    }
    nav a:hover {
      color: #4db8ff;
    }

    /* Descripción */
    .descripcion {
      padding: 20px;
      background: #0f1a2ecc;
      backdrop-filter: blur(4px);
      border-bottom: 2px solid #1a2d4d;
      line-height: 1.6;
    }

    /* Buscador */
    .search {
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .search input {
      width: 60%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      outline: none;
      font-size: 1rem;
    }

    /* Contenedor */
    .container {
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    /* Producto */
    .producto {
      background: #111d33dd;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #1f3b66;
      transition: 0.3s;
      backdrop-filter: blur(3px);
    }
    .producto:hover {
      transform: scale(1.03);
      border-color: #4db8ff;
    }
    .producto img {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .titulo-prod {
      font-size: 1.2rem;
      font-weight: bold;
      color: #4db8ff;
    }

    .precio {
      font-size: 1.1rem;
      margin-top: 5px;
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      border: none;
      background: #4db8ff;
      color: black;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.25s;
    }
    button:hover {
      background: #80ccff;
    }

  </style>
</head>
<body>

  <div class="bg-anim">
    <span style="left:10%; animation-delay:0s;"></span>
    <span style="left:30%; animation-delay:2s;"></span>
    <span style="left:50%; animation-delay:4s;"></span>
    <span style="left:70%; animation-delay:1s;"></span>
    <span style="left:90%; animation-delay:3s;"></span>
  </div>

  <header>Rainsek - Innovación Tecnológica Global</header>

  <nav>
    <a href="#">Electrónica</a>
    <a href="#">Videojuegos</a>
    <a href="#">Bases de Datos</a>
    <a href="#">Servicios</a>
  </nav>

  <section class="descripcion">
    <h2>Sobre Rainsek</h2>
    <p>Rainsek es una empresa multifilial orientada al mercado internacional que opera en tres áreas principales: electrónica, bases de datos y videojuegos...</p>
  </section>

  <div class="search">
    <input id="searchInput" type="text" placeholder="Buscar productos..." />
  </div>

  <div class="container" id="productContainer">
  </div>

  <script>
    const productos = [
      { nombre: "Arduino UNO R3", precio: 45000, img: "https://upload.wikimedia.org/wikipedia/commons/3/31/Arduino_Uno_R3.jpg" },
      { nombre: "Cable Ethernet 1m", precio: 8000, img: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Ethernet_Cable.jpg/640px-Ethernet_Cable.jpg" },
      { nombre: "Tira LED RGB 5m", precio: 22000, img: "https://upload.wikimedia.org/wikipedia/commons/8/8e/LED_strip.jpg" },
      { nombre: "SSD 500GB", precio: 150000, img: "https://upload.wikimedia.org/wikipedia/commons/5/59/SSD_Samsung_860_EVO.jpg" },
      { nombre: "Call of Duty (Digital)", precio: 130000, img: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/49/Call_of_Duty_Black_Ops_Cold_War_Cover.jpg/640px-Call_of_Duty_Black_Ops_Cold_War_Cover.jpg" },
      { nombre: "Base de Datos Corporativa", precio: 480000, img: "https://upload.wikimedia.org/wikipedia/commons/4/4c/Database-icon.svg" }
    ];

    const cont = document.getElementById("productContainer");

    function render(lista) {
      cont.innerHTML = "";
      lista.forEach(p => {
        cont.innerHTML += `
          <div class='producto'>
            <img src="${p.img}" />
            <div class='titulo-prod'>${p.nombre}</div>
            <div class='precio'>$${p.precio.toLocaleString()} COP</div>
            <button>Comprar</button>
          </div>
        `;
      });
    }

    render(productos);

    document.getElementById("searchInput").addEventListener("input", e => {
      const val = e.target.value.toLowerCase();
      const filtrado = productos.filter(p => p.nombre.toLowerCase().includes(val));
      render(filtrado);
    });
  </script>

</body>
</html>
